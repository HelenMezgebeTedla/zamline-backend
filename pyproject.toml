[project]
name = "zamline-backend"
version = "0.1.0"
description = "ZamLine freight coordination backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.29",
    "gunicorn>=20.1",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic[email]>=2.6",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pyzbar>=0.1.9",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx2>=2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "B008",  
]
